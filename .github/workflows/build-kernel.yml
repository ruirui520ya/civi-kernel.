name: Build mona kernel (KernelSU Next)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: 释放磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: 安装依赖与工具链
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential ccache curl flex \
            libelf-dev libssl-dev liblz4-tool lz4 python3 cpio rsync unzip zip \
            device-tree-compiler clang-12 lld-12 llvm-12 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: 拉取内核源码
        run: |
          git clone --depth=1 -b mona-r-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel

      - name: 修补源码
        run: |
          cd kernel

          echo "=== 1. coresight 参数数量 ==="
          F=drivers/hwtracing/coresight/coresight-byte-cntr.c
          sed -i 's/usb_qdss_alloc_req(ch, USB_BUF_NUM)/usb_qdss_alloc_req(ch, USB_BUF_NUM, USB_BUF_NUM)/g' $F
          sed -i 's/usb_qdss_free_req(ch)/usb_qdss_free_req(ch, USB_BUF_NUM, USB_BUF_NUM)/g' $F

          echo "=== 2. fs/namespace.c add path_umount for KernelSU ==="
          F3=fs/namespace.c
          if grep -q "int path_umount" $F3; then
            echo "path_umount already exists, skip"
          else
            printf '%s\n' \
            '' \
            '#ifdef CONFIG_KSU' \
            'int path_umount(struct path *path, int flags)' \
            '{' \
            '    struct mount *mnt = real_mount(path->mnt);' \
            '    int ret;' \
            '' \
            '    ret = may_umount(mnt);' \
            '    if (ret)' \
            '        return ret;' \
            '' \
            '    down_write(&namespace_sem);' \
            '    umount_tree(mnt, UMOUNT_SYNC);' \
            '    up_write(&namespace_sem);' \
            '    return 0;' \
            '}' \
            'EXPORT_SYMBOL(path_umount);' \
            '#endif' >> $F3
            echo "path_umount appended"
          fi
          tail -n 22 $F3

      - name: 集成 KernelSU Next (legacy)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy
          ls -l drivers/kernelsu || true

      - name: 生成内核配置
        run: |
          set -e
          cd kernel
          export PATH=/usr/lib/llvm-12/bin:$PATH
          M="O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make $M gki_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/mona_QGKI.config
          printf '%s\n' \
          'CONFIG_KSU=y' \
          'CONFIG_KSU_KPROBE_HOOKS=y' \
          'CONFIG_KPROBES=y' \
          'CONFIG_KPROBE_EVENTS=y' \
          'CONFIG_ICNSS2_QMI=y' \
          'CONFIG_QCOM_SMEM=y' \
          '# CONFIG_QTI_TZ_LOG is not set' \
          '# CONFIG_WERROR is not set' >> out/.config
          make $M olddefconfig
          echo "--- config check ---"
          grep -E "^CONFIG_KSU|^CONFIG_ICNSS2|^CONFIG_QCOM_SMEM|QTI_TZ_LOG|WERROR" out/.config || true

      - name: 编译内核镜像（只编 Image）
        run: |
          cd kernel
          export PATH=/usr/lib/llvm-12/bin:$PATH
          M="O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          W="-Wno-error -Wno-implicit-function-declaration -Wno-incompatible-pointer-types -Wno-enum-conversion -Wno-int-conversion -Wno-visibility"
          make $M KCFLAGS="$W" -j"$(nproc)" Image
          echo "=== build finished ==="
          ls -lh out/arch/arm64/boot/ 2>/dev/null || true

      - name: 检查产物
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            echo "IMAGE OK"
            ls -lh kernel/out/arch/arm64/boot/Image*
          else
            echo "::error::Image 未生成，编译失败"
            exit 1
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mona-kernel-image
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/System.map
            kernel/out/.config
          if-no-files-found: warn
