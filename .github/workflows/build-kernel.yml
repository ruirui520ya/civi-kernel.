name: Build mona kernel (KernelSU Next)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "MiCode 源码分支"
        required: true
        default: "mona-r-oss"
      defconfig:
        description: "defconfig 路径（相对 arch/arm64/configs）"
        required: true
        default: "vendor/mona_defconfig"
      clang_ver:
        description: "AOSP prebuilt clang 版本"
        required: true
        default: "clang-r383902"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: 释放磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential ccache curl flex \
            libelf-dev libssl-dev liblz4-tool lz4 python3 cpio rsync unzip zip device-tree-compiler

      - name: 拉取内核源码
        run: |
          if ! git clone --depth=1 -b "${{ inputs.kernel_branch }}" \
               https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel; then
            echo "::error::分支 ${{ inputs.kernel_branch }} 拉取失败。可用分支："
            git ls-remote --heads https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git | awk '{print $2}'
            exit 1
          fi
          cd kernel
          echo "--- mona 相关 defconfig ---"
          find arch/arm64/configs -iname '*mona*' || true

      - name: 下载工具链
        run: |
          set -e
          mkdir -p tc && cd tc
          A=https://android.googlesource.com/platform/prebuilts
          curl -fL -o clang.tar.gz "$A/clang/host/linux-x86/+archive/refs/heads/master/${{ inputs.clang_ver }}.tar.gz"
          mkdir -p clang && tar -xzf clang.tar.gz -C clang
          curl -fL -o gcc64.tar.gz "$A/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/master.tar.gz"
          mkdir -p gcc64 && tar -xzf gcc64.tar.gz -C gcc64
          curl -fL -o gcc32.tar.gz "$A/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/heads/master.tar.gz"
          mkdir -p gcc32 && tar -xzf gcc32.tar.gz -C gcc32

      - name: 集成 KernelSU Next (legacy)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: 写入 KSU 配置
        run: |
          cd kernel
          DEF="arch/arm64/configs/${{ inputs.defconfig }}"
          if [ ! -f "$DEF" ]; then
            echo "::error::找不到 $DEF，可用："
            find arch/arm64/configs -name '*defconfig' | head -40
            exit 1
          fi
          for C in CONFIG_KSU=y CONFIG_KSU_KPROBE_HOOKS=y CONFIG_KPROBES=y CONFIG_KPROBE_EVENTS=y; do
            K="${C%%=*}"
            if grep -q "^${K}=" "$DEF"; then sed -i "s|^${K}=.*|${C}|" "$DEF"; else echo "$C" >> "$DEF"; fi
          done

      - name: 编译内核
        run: |
          set -e
          cd kernel
          export PATH="$PWD/../tc/clang/bin:$PWD/../tc/gcc64/bin:$PWD/../tc/gcc32/bin:$PATH"
          M="O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make $M "${{ inputs.defconfig }}"
          make $M -j"$(nproc)"
          ls -lh out/arch/arm64/boot/Image* || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mona-kernel-image
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/System.map
          if-no-files-found: warn
