name: Build mona kernel (KernelSU Next)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: 释放磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: 安装依赖与工具链
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential ccache curl flex \
            libelf-dev libssl-dev liblz4-tool lz4 python3 cpio rsync unzip zip \
            device-tree-compiler clang-12 lld-12 llvm-12 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: 拉取内核源码
        run: |
          git clone --depth=1 -b mona-r-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel

      - name: 修补源码缺陷
        run: |
          cd kernel

          echo "=== 1. coresight: usb_qdss 少传参数 ==="
          F1=drivers/hwtracing/coresight/coresight-byte-cntr.c
          sed -i 's/usb_qdss_alloc_req(ch, USB_BUF_NUM)/usb_qdss_alloc_req(ch, USB_BUF_NUM, USB_BUF_NUM)/g' $F1
          sed -i 's/usb_qdss_free_req(ch)/usb_qdss_free_req(ch, USB_BUF_NUM, USB_BUF_NUM)/g' $F1
          grep -n "usb_qdss_alloc_req\|usb_qdss_free_req" $F1 || true

          echo "=== 2. qmi.h: 函数重名冲突 ==="
          F2=drivers/soc/qcom/icnss2/qmi.h
          echo "--- 修补前 ---"
          grep -n "wlfw_wlan_mode_send_sync_msg" $F2 || true
          # 只改以 "int " 开头的非 static 版本，避免影响 static inline 版本
          sed -i 's/^int wlfw_wlan_mode_send_sync_msg(/int wlfw_wlan_mode_send_sync_msg_v01(/' $F2
          echo "--- 修补后 ---"
          grep -n "wlfw_wlan_mode_send_sync_msg" $F2 || true

      - name: 集成 KernelSU Next (legacy)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: 生成内核配置
        run: |
          set -e
          cd kernel
          export PATH=/usr/lib/llvm-12/bin:$PATH
          M="O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make $M gki_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/mona_QGKI.config
          cat >> out/.config <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_KPROBE_HOOKS=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          # CONFIG_WERROR is not set
          EOF
          make $M olddefconfig
          grep -E "^CONFIG_KSU|WERROR" out/.config || true

      - name: 编译内核
        run: |
          cd kernel
          export PATH=/usr/lib/llvm-12/bin:$PATH
          M="O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          W="-Wno-error -Wno-implicit-function-declaration -Wno-incompatible-pointer-types -Wno-enum-conversion -Wno-int-conversion -Wno-visibility"
          make $M KCFLAGS="$W" -k -j"$(nproc)"
          echo "=== 编译结束 ==="
          ls -lh out/arch/arm64/boot/ 2>/dev/null || true

      - name: 检查产物
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            echo "IMAGE OK"
            ls -lh kernel/out/arch/arm64/boot/Image*
          else
            echo "::error::Image 未生成，编译失败"
            exit 1
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mona-kernel-image
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/System.map
            kernel/out/.config
          if-no-files-found: warn
